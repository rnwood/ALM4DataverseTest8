name: DEPLOY-main
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0} <- {1}', github.event.inputs['target-environment'], github.event.inputs['build-run-name'] || format('latest from {0}', github.ref_name)) || format('Deploy auto <- run {0}', github.run_id) }}

# Stage-per-environment deployment workflow (generated by setup-github.ps1).
#
# To add another environment later:
#   1. Add it to workflow_dispatch target-environment options.
#   2. Add a deploy-* job and chain needs to the previous stage.
#   3. Set previous-environment-name to the previous stage short name.

permissions:
  actions: read
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      build-run-name:
        description: 'Optional exact BUILD name to deploy. Leave blank to use the latest successful BUILD from this branch. Numeric run IDs also work.'
        required: false
        type: string
      target-environment:
        description: 'Target environment to deploy to'
        required: true
        type: choice
        options:
          - 'prod'

jobs:
  deploy-prod:
    # First stage in the chain.
    # Manual-gate-tag mode requires an explicit workflow_dispatch, even for stage 1.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target-environment == 'prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: 'prod'
    concurrency:
      group: alm4dataverse-environment-prod
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Deploy to prod
        uses: rnwood/ALM4DataverseTest8Shared/.github/actions/deploy@main
        with:
          environment-name: 'prod'
          previous-environment-name: ''
          promotion-mode: manual-gate-tag
          trigger-branch: 'main'
          github-context-json: ${{ toJSON(github) }}
          caller-inputs-json: ${{ toJSON(inputs) }}
          vars-json: ${{ toJSON(vars) }}
          # Add any custom secrets explicitly to this JSON object.
          secrets-json: >-
            {
              "AZURE_CLIENT_SECRET": ${{ toJSON(secrets.AZURE_CLIENT_SECRET) }}
            }
